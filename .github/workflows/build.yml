name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install streamlit openpyxl pandas pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name GeraPlanilha `
            --add-data "gera_planilha2.py;." `
            --collect-all streamlit `
            --collect-all altair `
            launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeraPlanilha-Windows
          path: dist/GeraPlanilha.exe

